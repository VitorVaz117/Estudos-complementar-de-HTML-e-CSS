<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="fontawesomeweb/css/all.css" rel="stylesheet"/>
    <style>
        *{/*Todos os elementos do HTML*/
            margin: 0px;
            padding: 0px;
        }

        header{
            background-color: black;
            color: white;
            padding: 5px 0px 5px 3px;
            display: flex;
            justify-content: space-between; /* título à esquerda, ícones à direita */
            align-items: center;            /* alinha verticalmente */
        }

        i {
            color: white;
            font-size: 20px;
        }

        .PosicaoIcones{
            display: flex;
            gap: 10px; /* espaço entre os ícones */
        }

        main{
            background-color: darkolivegreen;
            height: 100vw;
            width: 100vw;
        }

        .containerA{

            color: white;
        }

        .fonteMaiuscula{
            text-transform: uppercase;
        }

    </style>
</head>
<body>
    <header>
        <h1>Jeep</h1>
        <img src="" alt="">
        
        <div class="PosicaoIcones">
            <i class="fa-regular fa-user"></i>
            <i class="fa-solid fa-bars"></i>
        </div>
        
    </header>
    <main>
        <div containerA>
            <p class="fonteMaiuscula">Serviços Jeep</p>
            <h1 class="fonteMaiuscula">Seu Jeep bem cuidado</h1>
            <p>Soluções e profissionais preparados para ajudar você.</p>
        </div>
        
    </main>
    

</body>
</html>
