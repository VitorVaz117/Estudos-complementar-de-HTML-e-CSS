<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil</title>
    <style>

        :root{
            --cor0: #1098F7;
            --cor1: #E94F37;
            --cor3: #F6F7EB;
            --cor4: #393E41;
        }

        *{/*Todos os elementos do html*/
        margin: 0px;
        padding: 0px;
        }

        body{
            background-color: var(--cor4);
            color: black;
            font-family: Arial, Helvetica, sans-serif;
        }

        .TamanhoFotoPerfil{
            width: 200px;
            height: 200px;
            border-radius: 150px;
            margin: 10px;
        }

        .redessociais{
            width: 35px;
            height: 35px;
            border-radius: 25px;
        }

        .containerprincipal{
            max-width: 750px;/*(Responsividade) o containerprincipal para de crescer em 750px*/
            min-height: 400px;/*Mantem a altura minima em 400px*/
            display: flex; /*para colocar os containers lado a lado.*/
            margin: auto;/*centraliza o conteúdo*/
            flex-wrap: wrap;

            border: 1px solid var(--cor3);
            border-radius: 5px; /*para arredondar as imagens e o container principal.*/
            overflow: hidden; /*como as divs possuem cores de fundo, para que as cores também respeitem os cantos arredondados*/
            background-color: var(--cor0);
            padding: 10px;
        }

        .ContainerFotoPerfil{
            background-color: var(--cor0);
        }

        .ContainerRedesSociais{
            background-color: var(--cor0);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            min-width: 250px;
        }

        .ContainerDescricao{
            background-color: var(--cor0);
            flex: 1;
            min-width: 300px;
        }

        .botoes{
            border: 3px solid white;
            padding: 5px;
        }

        a{
            text-decoration: none;
            color: white;
        }

        a:hover{
            text-decoration: underline;
        }

        div > p{
            margin-top: 10px;
            margin-bottom: 20px;
        }

        h1{
            margin-top: 15px;
        }

        h2{
            margin-top: 5px;
        }

    </style>
</head>
<body>

    <div class="containerprincipal">
        <div class="ContainerFotoPerfil">
            <img src="imagens/foto perfil.jpg" alt="" class="TamanhoFotoPerfil">

            <div class="ContainerRedesSociais">
                <img src="imagens/icons8-facebook-novo-50.png" alt="" class="redessociais">
                <img src="imagens/icons8-github-48.png" alt="" class="redessociais">
                <img src="imagens/icons8-instagram-50.png" alt="" class="redessociais">
                <img src="imagens/icons8-twitterx-48.png" alt="" class="redessociais">
            </div>
        </div>
        <div class="ContainerDescricao">
            <h1>Vitor Vaz</h1>
            <h2>Desenvolvedor Web</h2>
            <p>
                Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aperiam, voluptatibus sunt, nulla iste ut rerum dolores et atque nam deserunt, earum consectetur dicta vitae magni! Voluptate placeat cum commodi dicta.
            </p>

            <a href="" class="botoes">Meus projetos</a>
            <a href="" class="botoes">Entrar em contato</a>
        </div>

        
    </div>


</body>
</html>
