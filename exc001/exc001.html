<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil</title>
    <style>

        :root{
            --cor0: #1d679c;
            --cor1: #E94F37;
            --cor2: #06375a;
            --cor3: #F6F7EB;
            --cor4: #393E41;
        }

        *{/*Todos os elementos do html*/
        margin: 0px;
        padding: 0px;
        }

        body{
            background-color: var(--cor4);
            color: rgb(255, 255, 255);
            font-family: Arial, Helvetica, sans-serif;
        }

        .TamanhoFotoPerfil{
            width: 200px;
            height: 200px;
            border-radius: 50%; /*transforma a imagem em um círculo.*/
            object-fit: cover; /*A imagem mantém sua proporção e preenche o círculo, cortando apenas o que excede.*/
            margin: 10px;
            object-position: center 50%;/*Para ajustar a img dentro do circulo*/
        }

        .redessociais{
            width: 35px;
            height: 35px;
            border-radius: 25px;
        }

        .containerprincipal{
            max-width: 750px;/*(Responsividade) o containerprincipal para de crescer em 750px*/
            min-height: 400px;/*Mantem a altura minima em 400px*/
            display: flex; /*para colocar os containers lado a lado.*/
            margin: auto;/*centraliza o conteúdo*/
            flex-wrap: wrap;

            border: 1px solid var(--cor3);
            border-radius: 5px; /*para arredondar as imagens e o container principal.*/
            overflow: hidden; /*como as divs possuem cores de fundo, para que as cores também respeitem os cantos arredondados*/
            background-image: linear-gradient(to right, var(--cor0), var(--cor2));
        }

        .ContainerFotoPerfil{
            background-color: transparent;
        }

        .ContainerRedesSociais{
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            min-width: 250px;
        }

        .ContainerDescricao{
            background-color: transparent;
            flex: 1;
            min-width: 300px;
        }

        .Botoes{
            border: 3px solid white;
            padding: 10px 25px 10px 25px;
            border-radius: 5px;
        }

        .PosicionamentoBotoes{
            display: flex;
            gap: 45px;
        }

        a{
            text-decoration: none;
            font-weight: bold;
            color: white;
        }

        a:hover{
            background-color: white;
            color: var(--cor0);
        }

        div > p{
            margin: 10px 10px 20px 0px;
            text-align: justify;
        }

        h1{
            margin-top: 15px;
        }

        h2{
            margin-top: 5px;
            font-weight: 200;
        }

    </style>
</head>
<body>

    <div class="containerprincipal">
        <div class="ContainerFotoPerfil">
            <img src="imagens/foto perfil 2.jpg" alt="" class="TamanhoFotoPerfil">

            <div class="ContainerRedesSociais">
                <img src="imagens/icons8-facebook-novo-50.png" alt="" class="redessociais">
                <img src="imagens/icons8-github-48.png" alt="" class="redessociais">
                <img src="imagens/icons8-instagram-50.png" alt="" class="redessociais">
                <img src="imagens/icons8-twitterx-48.png" alt="" class="redessociais">
            </div>
        </div>
        <div class="ContainerDescricao">
            <h1>Vitor Vaz Sales</h1>
            <h2>Desenvolvedor Web</h2>
            <p>
                Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aperiam, voluptatibus sunt, nulla iste ut rerum dolores et atque nam deserunt, earum consectetur dicta vitae magni! Voluptate placeat cum commodi dicta.
            </p>
            
            <div class="PosicionamentoBotoes">
                <a href="" class="Botoes">Meus projetos</a>
                <a href="" class="Botoes">Entrar em contato</a>
            </div>
            
        </div>

        
    </div>


</body>
</html>
