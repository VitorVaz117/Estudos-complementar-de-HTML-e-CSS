<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil</title>
    <style>

        body{
            background-color: rgb(255, 165, 76);
        }

        .TamanhoFotoPerfil{
            width: 200px;
            height: 200px;
            border-radius: 150px;
            margin: 10px;
        }

        .redessociais{
            width: 50px;
            height: 50px;
            border-radius: 25px;
        }

        .containerprincipal{
            display: flex;
            border: 1px solid white;
            border-radius: 5px;
            overflow: hidden; /*como as divs possuem cores de fundo, para que as cores também respeitem os cantos arredondados*/
            width: 750px;
            height: 450px;
        }

        div#pos1{
            background-color: rgb(255, 132, 0);
            padding-left: 10px;
        }

        div#pos2{
            background-color: rgb(255, 132, 0);
        }

        div > p{
            padding-left: 5px;
        }

        .botoes{
            border: 3px solid white;
            padding: 5px;
        }

        a{
            text-decoration: none;
            color: white;
        }

        a:hover{
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="containerprincipal">
        <div id="pos1">
            <img src="imagens/foto perfil.jpg" alt="" class="TamanhoFotoPerfil">

            <div>
                <img src="imagens/foto perfil.jpg" alt="" class="redessociais">
                <img src="imagens/foto perfil.jpg" alt="" class="redessociais">
                <img src="imagens/foto perfil.jpg" alt="" class="redessociais">
                <img src="imagens/foto perfil.jpg" alt="" class="redessociais">
            </div>
        </div>
        <div id="pos2">
            <h1>Vitor Vaz</h1>
            <p id="teste">
                <h2>Desenvolvedor Web</h2>
                Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aperiam, voluptatibus sunt, nulla iste ut rerum dolores et atque nam deserunt, earum consectetur dicta vitae magni! Voluptate placeat cum commodi dicta.
            </p>
            <div class="teste">
                <a href="" class="botoes">Meus projetos</a>
                <a href="" class="botoes">Entrar em contato</a>
            </div>
        </div>

        
    </div>


</body>
</html>
